<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lisa Harris Cook Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #faf6ef;
        --surface: #ffffff;
        --surface-2: #f3ece0;
        --text: #2b2420;
        --muted: #7a6d62;
        --border: #e6dccd;
        --accent: #1f4e8c; /* deep blue */
        --accent-soft: #e3ecf8;
        --warm: #b5651d;
        --danger: #b3261e;
        --shadow:
          0 1px 2px rgba(60, 40, 20, 0.06), 0 4px 16px rgba(60, 40, 20, 0.06);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1b1815;
          --surface: #24201c;
          --surface-2: #2e2924;
          --text: #f1ebe3;
          --muted: #a89a8c;
          --border: #3a332c;
          --accent: #8db4ec;
          --accent-soft: #23324a;
          --warm: #e0a060;
          --danger: #f28b84;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
      }
      :root[data-theme="dark"] {
        --bg: #1b1815;
        --surface: #24201c;
        --surface-2: #2e2924;
        --text: #f1ebe3;
        --muted: #a89a8c;
        --border: #3a332c;
        --accent: #8db4ec;
        --accent-soft: #23324a;
        --warm: #e0a060;
        --danger: #f28b84;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 Inter,
          system-ui,
          -apple-system,
          sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: Fraunces, Georgia, serif;
        line-height: 1.2;
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 16px;
      }

      header {
        padding: 28px 0 8px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .brand h1 {
        font-size: clamp(1.6rem, 4vw, 2.3rem);
      }
      .brand p {
        margin: 2px 0 0;
        color: var(--muted);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .avatar {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        object-fit: cover;
        object-position: center 40%;
        flex: none;
        border: 3px solid var(--surface);
        box-shadow:
          0 0 0 2px var(--accent),
          0 4px 12px rgba(0, 0, 0, 0.12);
      }
      @media (max-width: 520px) {
        .avatar {
          width: 64px;
          height: 64px;
        }
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid var(--border);
        background: var(--surface);
        padding: 9px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 500;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      :root[data-theme="dark"] .btn.primary {
        color: #10161f;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .btn.primary {
          color: #10161f;
        }
      }
      .btn.danger {
        color: var(--danger);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
      }

      nav.tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 16px 0 4px;
        scrollbar-width: thin;
        border-bottom: 1px solid var(--border);
        margin-bottom: 16px;
      }
      .tab {
        flex: none;
        border: 0;
        background: transparent;
        padding: 9px 14px;
        border-radius: 10px 10px 0 0;
        cursor: pointer;
        color: var(--muted);
        font-weight: 500;
        border-bottom: 3px solid transparent;
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .tab.jewish {
        font-weight: 600;
      }
      .tab .count {
        font-size: 0.78em;
        background: var(--surface-2);
        padding: 1px 7px;
        border-radius: 99px;
        margin-left: 4px;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        align-items: center;
      }
      .toolbar input[type="search"] {
        flex: 1 1 240px;
      }
      input,
      select,
      textarea {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 9px 12px;
        width: 100%;
      }
      .toolbar select {
        width: auto;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--accent-soft);
        border-color: var(--accent);
      }

      .jewish-banner {
        background: var(--accent-soft);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .jewish-banner .star {
        font-size: 1.6rem;
        color: var(--accent);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 99px;
        padding: 4px 11px;
        font-size: 0.86rem;
        cursor: pointer;
      }
      .chip.active {
        background: var(--accent);
        color: var(--surface);
        border-color: var(--accent);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
        padding-bottom: 48px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        text-align: left;
        padding: 0;
      }
      .card:hover {
        border-color: var(--accent);
      }
      .card .img {
        aspect-ratio: 16/10;
        background: var(--surface-2) center/cover no-repeat;
        display: grid;
        place-items: center;
        font-size: 2.2rem;
      }
      .card .body {
        padding: 12px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card h3 {
        font-size: 1.15rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.86rem;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .tags {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .tag {
        font-size: 0.75rem;
        padding: 2px 8px;
        border-radius: 99px;
        background: var(--surface-2);
        color: var(--muted);
      }
      .tag.j {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .tag.k-meat {
        color: #a3352b;
      }
      .tag.k-dairy {
        color: #2c6aa8;
      }
      .tag.k-pareve {
        color: #4d7a3a;
      }
      .fav {
        color: var(--warm);
      }

      .empty {
        text-align: center;
        padding: 56px 16px;
        color: var(--muted);
        grid-column: 1 / -1;
      }
      .empty .big {
        font-size: 2.6rem;
      }

      /* Dialogs */
      dialog {
        border: 0;
        border-radius: var(--radius);
        padding: 0;
        width: min(760px, calc(100vw - 24px));
        max-height: calc(100vh - 32px);
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      dialog::backdrop {
        background: rgba(20, 14, 8, 0.5);
      }
      .dlg-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: var(--surface);
        z-index: 1;
        gap: 8px;
      }
      .dlg-body {
        padding: 18px 20px;
      }
      .dlg-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        position: sticky;
        bottom: 0;
        background: var(--surface);
        flex-wrap: wrap;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .form-grid .full {
        grid-column: 1 / -1;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.88rem;
        font-weight: 500;
        color: var(--muted);
      }
      label.inline {
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }
      label.inline input {
        width: auto;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      .jewish-fields {
        border: 1px dashed var(--accent);
        border-radius: 12px;
        padding: 12px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .jewish-fields legend {
        color: var(--accent);
        font-weight: 600;
        padding: 0 6px;
      }
      .hint {
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 400;
      }

      .view-img {
        width: 100%;
        max-height: 340px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 14px;
      }
      .view-cols {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 24px;
        margin-top: 16px;
      }
      .view-cols h3 {
        font-size: 1.1rem;
        margin-bottom: 8px;
      }
      .view-cols ul,
      .view-cols ol {
        margin: 0;
        padding-left: 20px;
      }
      .view-cols li {
        margin-bottom: 6px;
      }
      .ing li {
        cursor: pointer;
      }
      .ing li.done {
        text-decoration: line-through;
        color: var(--muted);
      }
      .notes {
        background: var(--surface-2);
        padding: 12px 14px;
        border-radius: 10px;
        margin-top: 18px;
        white-space: pre-wrap;
      }


      /* Category colors */
      [data-cat] { --cat: var(--accent); --cat-soft: var(--accent-soft); }
      [data-cat="jewish"]       { --cat: #1f4e8c; --cat-soft: #e3ecf8; }
      [data-cat="thanksgiving"] { --cat: #b5651d; --cat-soft: #f8e9da; }
      [data-cat="chinese"]      { --cat: #b3261e; --cat-soft: #f9e1df; }
      [data-cat="mains"]        { --cat: #7a3e9d; --cat-soft: #efe4f6; }
      [data-cat="sides"]        { --cat: #3f7d3a; --cat-soft: #e3f0df; }
      [data-cat="breads"]       { --cat: #9a6b12; --cat-soft: #f6ecd6; }
      [data-cat="sauces"]       { --cat: #1f7a7a; --cat-soft: #dcf0ef; }
      [data-cat="breakfast"]    { --cat: #6b7f12; --cat-soft: #eef3d6; }
      [data-cat="indian"]       { --cat: #b8560f; --cat-soft: #fbe7d4; }
      [data-cat="soups"]        { --cat: #3b4f9e; --cat-soft: #e6e9f8; }
      [data-cat="desserts"]     { --cat: #a8326e; --cat-soft: #f8e1ec; }
      [data-cat="other"]        { --cat: #6b6259; --cat-soft: #ece7e1; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) [data-cat="jewish"]       { --cat: #8db4ec; --cat-soft: #23324a; }
        :root:not([data-theme="light"]) [data-cat="thanksgiving"] { --cat: #e0a060; --cat-soft: #3d2a18; }
        :root:not([data-theme="light"]) [data-cat="chinese"]      { --cat: #f28b84; --cat-soft: #3f1f1c; }
        :root:not([data-theme="light"]) [data-cat="mains"]        { --cat: #c9a0e6; --cat-soft: #33243f; }
        :root:not([data-theme="light"]) [data-cat="sides"]        { --cat: #8fcf86; --cat-soft: #20331d; }
        :root:not([data-theme="light"]) [data-cat="breads"]       { --cat: #e6c26a; --cat-soft: #3a3018; }
        :root:not([data-theme="light"]) [data-cat="sauces"]       { --cat: #6fd0cc; --cat-soft: #173634; }
        :root:not([data-theme="light"]) [data-cat="breakfast"]    { --cat: #c3d86e; --cat-soft: #2b3317; }
        :root:not([data-theme="light"]) [data-cat="indian"]       { --cat: #f2a463; --cat-soft: #3f2a17; }
        :root:not([data-theme="light"]) [data-cat="soups"]        { --cat: #9fb0ec; --cat-soft: #232a45; }
        :root:not([data-theme="light"]) [data-cat="desserts"]     { --cat: #f095c0; --cat-soft: #3f1f30; }
        :root:not([data-theme="light"]) [data-cat="other"]        { --cat: #b8ada2; --cat-soft: #34302b; }
      }
      :root[data-theme="dark"] [data-cat="jewish"]       { --cat: #8db4ec; --cat-soft: #23324a; }
      :root[data-theme="dark"] [data-cat="thanksgiving"] { --cat: #e0a060; --cat-soft: #3d2a18; }
      :root[data-theme="dark"] [data-cat="chinese"]      { --cat: #f28b84; --cat-soft: #3f1f1c; }
      :root[data-theme="dark"] [data-cat="mains"]        { --cat: #c9a0e6; --cat-soft: #33243f; }
      :root[data-theme="dark"] [data-cat="sides"]        { --cat: #8fcf86; --cat-soft: #20331d; }
      :root[data-theme="dark"] [data-cat="breads"]       { --cat: #e6c26a; --cat-soft: #3a3018; }
      :root[data-theme="dark"] [data-cat="sauces"]       { --cat: #6fd0cc; --cat-soft: #173634; }
      :root[data-theme="dark"] [data-cat="breakfast"]    { --cat: #c3d86e; --cat-soft: #2b3317; }
      :root[data-theme="dark"] [data-cat="indian"]       { --cat: #f2a463; --cat-soft: #3f2a17; }
      :root[data-theme="dark"] [data-cat="soups"]        { --cat: #9fb0ec; --cat-soft: #232a45; }
      :root[data-theme="dark"] [data-cat="desserts"]     { --cat: #f095c0; --cat-soft: #3f1f30; }
      :root[data-theme="dark"] [data-cat="other"]        { --cat: #b8ada2; --cat-soft: #34302b; }

      .tab[data-cat].active { color: var(--cat); border-bottom-color: var(--cat); }
      .tab[data-cat].active .count { background: var(--cat-soft); color: var(--cat); }
      .card[data-cat] { border-top: 5px solid var(--cat); }
      .card[data-cat]:hover { border-color: var(--cat); }
      .card[data-cat] .img { background-color: var(--cat-soft); }
      .card[data-cat] h3 { color: var(--cat); }
      .cat-pill {
        font-size: 0.75rem;
        font-weight: 600;
        padding: 2px 9px;
        border-radius: 99px;
        background: var(--cat-soft);
        color: var(--cat);
      }
      dialog[data-cat] .dlg-head { border-bottom: 4px solid var(--cat); }
      dialog[data-cat] .dlg-head h2 { color: var(--cat); }
      dialog[data-cat] .view-cols h3 {
        color: var(--cat);
        border-bottom: 2px solid var(--cat-soft);
        padding-bottom: 4px;
      }
      dialog[data-cat] .view-cols li::marker { color: var(--cat); font-weight: 700; }
      dialog[data-cat] .notes { background: var(--cat-soft); border-left: 4px solid var(--cat); }

      @media (max-width: 640px) {
        .form-grid,
        .jewish-fields,
        .view-cols {
          grid-template-columns: 1fr;
        }
      }
      @media print {
        header,
        nav,
        .toolbar,
        .jewish-banner,
        .grid,
        .dlg-foot,
        .dlg-head .btn {
          display: none !important;
        }
        dialog {
          position: static;
          box-shadow: none;
          width: 100%;
          max-height: none;
        }
        dialog::backdrop {
          display: none;
        }
        body {
          background: #fff;
          color: #000;
        }
      }
    </style>
  </head>
  <body>
    <header class="wrap">
      <div class="top">
        <div class="brand">
          <img
            class="avatar"
            src="profile.jpg"
            alt="Lisa Harris"
            width="84"
            height="84"
          />
          <div>
            <h1>Lisa Harris Cook Book</h1>
            <p>Every family recipe, in one place.</p>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" id="addBtn">+ Add recipe</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <nav class="tabs" id="tabs" aria-label="Recipe categories"></nav>
      <div id="jewishBanner"></div>
      <div class="toolbar">
        <input
          type="search"
          id="search"
          placeholder="Search recipes, ingredients, notes…"
          aria-label="Search recipes"
        />
        <select id="sort" aria-label="Sort recipes">
          <option value="az">A → Z</option>
          <option value="new">Newest first</option>
          <option value="fav">Favorites first</option>
        </select>
        <label class="inline"
          ><input type="checkbox" id="favOnly" /> Favorites only</label
        >
      </div>
      <section class="grid" id="grid" aria-live="polite"></section>
    </main>

    <!-- View recipe -->
    <dialog id="viewDlg">
      <div class="dlg-head">
        <h2 id="vTitle"></h2>
        <button class="btn ghost" data-close aria-label="Close">✕</button>
      </div>
      <div class="dlg-body" id="vBody"></div>
      <div class="dlg-foot">
        <button class="btn danger" id="vDelete">Delete</button>
        <button class="btn" id="vPrint">Print</button>
        <button class="btn" id="vFav"></button>
        <button class="btn primary" id="vEdit">Edit</button>
      </div>
    </dialog>

    <!-- Add / edit recipe -->
    <dialog id="editDlg">
      <form id="form" method="dialog">
        <div class="dlg-head">
          <h2 id="eTitle">Add recipe</h2>
          <button type="button" class="btn ghost" data-close aria-label="Close">
            ✕
          </button>
        </div>
        <div class="dlg-body form-grid">
          <label class="full"
            >Recipe name *<input
              name="title"
              required
              placeholder="e.g. Grandma's Brisket"
          /></label>
          <label
            >Category
            <select name="category" id="catSelect"></select>
          </label>
          <label
            >From / credit<input name="source" placeholder="e.g. Aunt Ruth"
          /></label>
          <label
            >Prep + cook time<input name="time" placeholder="e.g. 1 hr 30 min"
          /></label>
          <label>Serves<input name="servings" placeholder="e.g. 6–8" /></label>

          <fieldset class="jewish-fields full" id="jewishFields">
            <legend>✡ Jewish recipe details</legend>
            <label
              >Holiday / occasion
              <select name="holiday" id="holidaySelect"></select>
            </label>
            <label
              >Kosher type
              <select name="kosher">
                <option value="">—</option>
                <option>Meat</option>
                <option>Dairy</option>
                <option>Pareve</option>
              </select>
            </label>
            <label class="inline full"
              ><input type="checkbox" name="passover" /> Kosher for
              Passover</label
            >
          </fieldset>

          <label class="full"
            >Ingredients <span class="hint">One per line</span>
            <textarea
              name="ingredients"
              placeholder="2 cups flour&#10;3 eggs&#10;1 tsp salt"
            ></textarea>
          </label>
          <label class="full"
            >Directions <span class="hint">One step per line</span>
            <textarea
              name="steps"
              placeholder="Preheat oven to 350°F.&#10;Mix dry ingredients…"
            ></textarea>
          </label>
          <label class="full"
            >Notes / memories<textarea
              name="notes"
              style="min-height: 80px"
              placeholder="Always doubled for Thanksgiving…"
            ></textarea>
          </label>
          <label class="full"
            >Photo <span class="hint">Optional</span>
            <input type="file" name="photo" accept="image/*" />
          </label>
          <div class="full" id="photoPreview"></div>
          <label class="inline full"
            ><input type="checkbox" name="favorite" /> ★ Favorite</label
          >
        </div>
        <div class="dlg-foot">
          <button type="button" class="btn" data-close>Cancel</button>
          <button type="submit" class="btn primary">Save recipe</button>
        </div>
      </form>
    </dialog>

    <script>
      (() => {
        const STORE_KEY = 'lhcb.recipes.v1';
        const CATEGORIES = [
          { id: 'jewish',    label: 'Jewish',     icon: '✡' },
          { id: 'thanksgiving', label: 'Thanksgiving', icon: '🦃' },
          { id: 'chinese',   label: 'Chinese',    icon: '🥢' },
          { id: 'breakfast', label: 'Breakfast',  icon: '🥞' },
          { id: 'indian',    label: 'Indian',     icon: '🍛' },
          { id: 'mains',     label: 'Mains',      icon: '🍲' },

            notes: 'An easy one-skillet curry ready in 20 minutes. Keeps airtight in the fridge up to 1 week.\n\nPer serving: 474 kcal; Carbs 34 g; Protein 32 g; Fat 25 g.',
            photo: '',
          },
          {

            title: 'Skillet Cacio e Pepe Tortellini with Wilted Greens', category: 'mains',
            source: 'Simply Recipes', time: '25 min (10 prep + 15 cook)', servings: '4',
            ingredients: [

            steps: [

              'Off the heat, stir in the greens a handful at a time until just wilted, about 2 minutes. Stir in the cheese and the remaining 2 Tbsp olive oil. Serve with more cheese and pepper.',

            notes: 'Refrigerate leftovers in an airtight container up to 5 days.',
            photo: '',
          },
          {

            notes: 'Lisa adds the kale with the broth (instead of at the end) and holds the tortellini and cream until dinnertime. She skips the red pepper flakes.',
            photo: '',
          },
          {
            id: 'seed-cape-malay-yellow-rice', favorite: false,
            title: 'Cape Malay Yellow Rice', category: 'indian',
            source: 'Lara Dunston', time: '25 min (5 prep + 20 cook)', servings: '4',
            ingredients: [
              '2 cups basmati or other long-grain white rice',
              'Water, as per rice cooker indicator',
              '100 g raisins (Lisa: ×3 = 1.5 cups)',

              '1 tsp brown sugar',

            steps: [
              'Wash the rice in a fine-mesh strainer under running water until clear. Shake off the excess water and transfer to the rice cooker.',
              'Add water to the rice cooker line, then the raisins, butter and oil, spices, sugar, salt, and white pepper. Stir well and turn on the cooker.',
              'When it turns off, leave 5 minutes, then open the lid a little and stir to fluff. Don’t worry if it looks wet — close the lid another 5 minutes so the moisture evaporates and the flavors meld.',

            ].join('\n'),
            notes: 'Sweet, spiced South African yellow rice — great with the Soft Butter Rotis and the Tomato, Cucumber and Chilli Sambal for a Cape Malay feast. Make extra; it’s fantastic as leftovers. Can also be cooked on the stove.\n\n(The second page in the binder is the end of a separate Cape Malay curry recipe — steps 5–10 only — so the curry itself isn’t here.)',
            photo: '',
          },
        ];

        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const lines = s => String(s || '').split('\n').map(l => l.trim()).filter(Boolean);
        const catOf = id => CATEGORIES.find(c => c.id === id) || CATEGORIES.at(-1);

        // ---------- storage ----------
        const SEEDED_KEY = 'lhcb.seeded.v1';
        let recipes = load();
        function load() {
          let list = [];
          try {
            const raw = localStorage.getItem(STORE_KEY);
            if (raw) list = JSON.parse(raw);
          } catch (e) { console.warn(e); }
          // Remove the old placeholder sample recipe.
          list = list.filter(r => !String(r.title || '').startsWith('Classic Challah (sample'));
          // Hot Pot Sauces moved from Other to the new Sauces tab.
          list.forEach(r => { if (r.id === 'seed-hot-pot-sauces' && r.category === 'other') r.category = 'sauces'; });
          // Fresh Spring Rolls moved from Other to the new Chinese tab.
          list.forEach(r => { if (r.id === 'seed-fresh-spring-rolls' && r.category === 'other') r.category = 'chinese'; });
          // Cowboy Breakfast Casserole moved from Mains to the new Breakfast tab.
          list.forEach(r => { if (r.id === 'seed-cowboy-breakfast-casserole' && r.category === 'mains') r.category = 'breakfast'; });
          // Give built-in recipes their printout photos once (if they don't already have one).
          let photoed = false;
          try { photoed = localStorage.getItem('lhcb.seedphotos.v3') === '1'; } catch {}
          if (!photoed) {
            for (const s of SEED_RECIPES) {
              const r = list.find(r => r.id === s.id);
              if (r && !r.photo && s.photo) r.photo = s.photo;
            }
            try { localStorage.setItem('lhcb.seedphotos.v3', '1'); } catch {}
          }
          // Add built-in recipes once (so deleting one later won't bring it back).
          let seeded = [];
          try { seeded = JSON.parse(localStorage.getItem(SEEDED_KEY) || '[]'); } catch {}
          for (const s of SEED_RECIPES) {
            if (!seeded.includes(s.id) && !list.some(r => r.id === s.id)) list.push({ ...s, created: Date.now() });
            if (!seeded.includes(s.id)) seeded.push(s.id);
          }
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify(list));
            localStorage.setItem(SEEDED_KEY, JSON.stringify(seeded));
          } catch (e) { console.warn(e); }
          return list;
        }
        function save() {
          try { localStorage.setItem(STORE_KEY, JSON.stringify(recipes)); return true; }
          catch (e) {
            alert('Could not save — your browser storage may be full (photos take up the most space). Try a smaller photo.');
            return false;
          }
        }

        // ---------- state ----------
        let tab = 'all';
        let holidayFilter = '';
        let editingId = null;
        let viewingId = null;
        let pendingPhoto = null; // undefined = unchanged, '' = removed, dataURL = new

        // ---------- render ----------
        function renderTabs() {
          const counts = Object.fromEntries(CATEGORIES.map(c => [c.id, 0]));
          recipes.forEach(r => counts[catOf(r.category).id]++);
          const tabs = [{ id: 'all', label: 'All Recipes', icon: '📖' }, ...CATEGORIES];
          $('#tabs').innerHTML = tabs.map(t => {
            const n = t.id === 'all' ? recipes.length : counts[t.id];
            return `<button class="tab ${t.id === tab ? 'active' : ''} ${t.id === 'jewish' ? 'jewish' : ''}" data-tab="${t.id}" ${t.id === 'all' ? '' : `data-cat="${t.id}"`} role="tab" aria-selected="${t.id === tab}">
              ${t.icon} ${esc(t.label)}<span class="count">${n}</span></button>`;
          }).join('');
        }

        function renderBanner() {
          const el = $('#jewishBanner');
          if (tab !== 'jewish') { el.innerHTML = ''; return; }
          const used = new Set(recipes.filter(r => r.category === 'jewish').map(r => r.holiday).filter(Boolean));
          const opts = HOLIDAYS.filter(h => used.has(h));
          el.innerHTML = `<div class="jewish-banner">
            <span class="star">✡</span>
            <div style="flex:1 1 200px"><strong>Jewish Recipes</strong><br><span class="hint">Holiday dishes, Shabbat favorites and family traditions.</span></div>
            ${opts.length ? `<div class="chips">
              <button class="chip ${holidayFilter === '' ? 'active' : ''}" data-holiday="">All holidays</button>
              ${opts.map(h => `<button class="chip ${holidayFilter === h ? 'active' : ''}" data-holiday="${esc(h)}">${esc(h)}</button>`).join('')}
            </div>` : ''}
          </div>`;
        }

        function filtered() {
          const q = $('#search').value.trim().toLowerCase();
          const favOnly = $('#favOnly').checked;
          let list = recipes.filter(r =>
            (tab === 'all' || catOf(r.category).id === tab) &&
            (tab !== 'jewish' || !holidayFilter || r.holiday === holidayFilter) &&
            (!favOnly || r.favorite) &&
            (!q || [r.title, r.ingredients, r.steps, r.notes, r.source, r.holiday].join(' ').toLowerCase().includes(q))
          );
          const sort = $('#sort').value;
          list.sort((a, b) =>
            sort === 'new' ? b.created - a.created :
            sort === 'fav' ? (b.favorite - a.favorite) || a.title.localeCompare(b.title) :
            a.title.localeCompare(b.title));
          return list;
        }

        function jewishTags(r) {
          if (r.category !== 'jewish') return '';
          let t = '';
          if (r.holiday) t += `<span class="tag j">${esc(r.holiday)}</span>`;
          if (r.kosher) t += `<span class="tag k-${r.kosher.toLowerCase()}">${esc(r.kosher)}</span>`;
          if (r.passover) t += `<span class="tag j">Kosher for Passover</span>`;
          return t;
        }

        function renderGrid() {
          const list = filtered();
          const grid = $('#grid');
          if (!list.length) {
            const anyInTab = recipes.some(r => tab === 'all' || catOf(r.category).id === tab);
            grid.innerHTML = `<div class="empty"><div class="big">${tab === 'jewish' ? '✡' : '🍽️'}</div>
              <p>${anyInTab ? 'No recipes match your search.' : `No ${tab === 'all' ? '' : esc(catOf(tab).label) + ' '}recipes yet.`}</p>
              ${anyInTab ? '' : `<button class="btn primary" data-add>+ Add ${tab === 'all' ? 'your first' : 'a ' + esc(catOf(tab).label)} recipe</button>`}</div>`;
            return;
          }
          grid.innerHTML = list.map(r => {
            const c = catOf(r.category);
            return `<button class="card" data-id="${r.id}" data-cat="${c.id}">
              <div class="img" style="${r.photo ? `background-image:url('${r.photo}')` : ''}">${r.photo ? '' : c.icon}</div>
              <div class="body">
                <h3>${r.favorite ? '<span class="fav">★</span> ' : ''}${esc(r.title)}</h3>
                <div class="meta">
                  ${r.time ? `<span>⏱ ${esc(r.time)}</span>` : ''}
                  ${r.servings ? `<span>🍽 ${esc(r.servings)}</span>` : ''}
                </div>
                <div class="tags">${tab === 'all' ? `<span class="cat-pill">${c.icon} ${esc(c.label)}</span>` : ''}${jewishTags(r)}</div>
              </div></button>`;
          }).join('');
        }

        function render() { renderTabs(); renderBanner(); renderGrid(); }

        // ---------- view ----------
        function openView(id) {
          const r = recipes.find(x => x.id === id); if (!r) return;
          viewingId = id;
          const c = catOf(r.category);
          $('#viewDlg').dataset.cat = c.id;
          $('#vTitle').textContent = r.title;
          const ing = lines(r.ingredients), steps = lines(r.steps);
          $('#vBody').innerHTML = `
            ${r.photo ? `<img class="view-img" src="${r.photo}" alt="">` : ''}
            <div class="meta">
              <span class="cat-pill">${c.icon} ${esc(c.label)}</span>
              ${r.time ? `<span>⏱ ${esc(r.time)}</span>` : ''}
              ${r.servings ? `<span>🍽 Serves ${esc(r.servings)}</span>` : ''}
              ${r.source ? `<span>👤 From ${esc(r.source)}</span>` : ''}
            </div>
            <div class="tags" style="margin-top:8px">${jewishTags(r)}</div>
            <div class="view-cols">
              <div><h3>Ingredients</h3>${ing.length ? `<ul class="ing">${ing.map(i => `<li>${esc(i)}</li>`).join('')}</ul><p class="hint">Tap an ingredient to check it off.</p>` : '<p class="hint">None listed.</p>'}</div>
              <div><h3>Directions</h3>${steps.length ? `<ol>${steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : '<p class="hint">None listed.</p>'}</div>
            </div>
            ${r.notes ? `<div class="notes"><strong>Notes</strong><br>${esc(r.notes)}</div>` : ''}`;
          $('#vFav').textContent = r.favorite ? '★ Favorited' : '☆ Favorite';
          $('#viewDlg').showModal();
        }

        // ---------- edit ----------
        function openEdit(id) {
          const f = $('#form');
          f.reset();
          editingId = id || null;
          pendingPhoto = undefined;
          const r = id ? recipes.find(x => x.id === id) : null;
          $('#eTitle').textContent = r ? 'Edit recipe' : 'Add recipe';
          const defaultCat = tab === 'all' ? 'jewish' : tab;
          const data = r || { category: defaultCat };
          for (const k of ['title','category','source','time','servings','holiday','kosher','ingredients','steps','notes']) {
            f.elements[k].value = data[k] ?? '';
          }
          f.elements.category.value = data.category || defaultCat;
          f.elements.passover.checked = !!data.passover;
          f.elements.favorite.checked = !!data.favorite;
          showPhotoPreview(r?.photo || '');
          toggleJewishFields();
          $('#editDlg').showModal();
          f.elements.title.focus();
        }

        function showPhotoPreview(src) {
          $('#photoPreview').innerHTML = src
            ? `<img src="${src}" alt="" style="max-width:180px;border-radius:10px;display:block;margin-bottom:6px">
               <button type="button" class="btn danger" id="removePhoto">Remove photo</button>` : '';
        }

        function toggleJewishFields() {
          $('#jewishFields').style.display = $('#catSelect').value === 'jewish' ? '' : 'none';
        }

        // Shrink photos so they fit comfortably in browser storage.
        function resizeImage(file, max = 1000) {
          return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
              const scale = Math.min(1, max / Math.max(img.width, img.height));
              const cv = document.createElement('canvas');
              cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
              cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
              URL.revokeObjectURL(url);
              resolve(cv.toDataURL('image/jpeg', 0.78));
            };
            img.onerror = reject;
            img.src = url;
          });
        }

        // ---------- events ----------
        $('#catSelect').innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.icon} ${esc(c.label)}</option>`).join('');
        $('#holidaySelect').innerHTML = '<option value="">—</option>' + HOLIDAYS.map(h => `<option>${esc(h)}</option>`).join('');
        $('#catSelect').addEventListener('change', toggleJewishFields);

        $('#tabs').addEventListener('click', e => {
          const b = e.target.closest('[data-tab]'); if (!b) return;
          tab = b.dataset.tab; holidayFilter = ''; render();
        });
        $('#jewishBanner').addEventListener('click', e => {
          const b = e.target.closest('[data-holiday]'); if (!b) return;
          holidayFilter = b.dataset.holiday; renderBanner(); renderGrid();
        });
        $('#grid').addEventListener('click', e => {
          if (e.target.closest('[data-add]')) return openEdit();
          const card = e.target.closest('.card'); if (card) openView(card.dataset.id);
        });
        ['#search', '#sort', '#favOnly'].forEach(s => $(s).addEventListener('input', renderGrid));
        $('#addBtn').addEventListener('click', () => openEdit());

        document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
        document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

        $('#vBody').addEventListener('click', e => { const li = e.target.closest('.ing li'); if (li) li.classList.toggle('done'); });
        $('#vEdit').addEventListener('click', () => { $('#viewDlg').close(); openEdit(viewingId); });
        $('#vPrint').addEventListener('click', () => window.print());
        $('#vFav').addEventListener('click', () => {
          const r = recipes.find(x => x.id === viewingId); if (!r) return;
          r.favorite = !r.favorite; save(); render();
          $('#vFav').textContent = r.favorite ? '★ Favorited' : '☆ Favorite';
        });
        $('#vDelete').addEventListener('click', () => {
          const r = recipes.find(x => x.id === viewingId); if (!r) return;
          if (!confirm(`Delete “${r.title}”? This can't be undone.`)) return;
          recipes = recipes.filter(x => x.id !== viewingId); save();
          $('#viewDlg').close(); render();
        });

        $('#form').elements.photo.addEventListener('change', async e => {
          const file = e.target.files[0]; if (!file) return;
          try { pendingPhoto = await resizeImage(file); showPhotoPreview(pendingPhoto); }
          catch { alert('Sorry, that image could not be read.'); }
        });
        $('#photoPreview').addEventListener('click', e => {
          if (e.target.id === 'removePhoto') { pendingPhoto = ''; $('#form').elements.photo.value = ''; showPhotoPreview(''); }
        });

        $('#form').addEventListener('submit', e => {
          e.preventDefault();
          const f = e.target.elements;
          const existing = editingId ? recipes.find(x => x.id === editingId) : null;
          const isJewish = f.category.value === 'jewish';
          const r = {
            id: existing?.id || crypto.randomUUID(),
            created: existing?.created || Date.now(),
            title: f.title.value.trim(),
            category: f.category.value,
            source: f.source.value.trim(),
            time: f.time.value.trim(),
            servings: f.servings.value.trim(),
            holiday: isJewish ? f.holiday.value : '',
            kosher: isJewish ? f.kosher.value : '',
            passover: isJewish && f.passover.checked,
            ingredients: f.ingredients.value,
            steps: f.steps.value,
            notes: f.notes.value,
            favorite: f.favorite.checked,
            photo: pendingPhoto === undefined ? (existing?.photo || '') : pendingPhoto,
          };
          if (!r.title) return;
          const before = recipes;
          recipes = existing ? recipes.map(x => x.id === r.id ? r : x) : [...recipes, r];
          if (!save()) { recipes = before; return; }
          $('#editDlg').close();
          render();
        });

        render();
      })();
    </script>
  </body>
</html>
